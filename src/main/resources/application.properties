spring.application.name=Caching

server.port=8081

# PostgreSQL (matches docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/caching
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis Cloud (plain connection, no TLS). Values come from the .env file in the project root.
spring.config.import=optional:file:.env[.properties]
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}

# Cache backed by Redis
spring.cache.type=redis