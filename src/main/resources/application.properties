spring.application.name=Caching

server.port=8081

# PostgreSQL (matches docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/caching
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis Cloud (plain connection, TLS is not enabled on this database)
spring.data.redis.host=eyes-tent-truck-11287.db.redis.io
spring.data.redis.port=19775
spring.data.redis.username=default
# spring.data.redis.password comes from secrets.properties (not committed)
spring.config.import=optional:file:./secrets.properties

# Cache backed by Redis
spring.cache.type=redis